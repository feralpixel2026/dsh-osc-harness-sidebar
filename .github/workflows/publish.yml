name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run only'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 零运行时依赖，无 lockfile；开启 cache: npm 会让 setup-node 直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify before publish
        run: npm run verify

      # npm 只在最后一步报 ENEEDAUTH，不说是哪个 secret 缺了。查在这里，
      # 失败信息直接指向仓库设置页，避免对着「need auth」猜。
      - name: Check npm token
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN 未配置。在 Settings → Secrets and variables → Actions 添加名为 NPM_TOKEN 的 secret（npm Automation token）。"
            exit 1
          fi
          echo "NPM_TOKEN 已配置"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
