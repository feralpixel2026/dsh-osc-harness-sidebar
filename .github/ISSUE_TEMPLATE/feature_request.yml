name: Feature request
description: 提一个功能建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先确认这个建议属于**外壳层**（分组、排序、显隐、轨道渲染、配置页）。
        具体的产品页面属于独立的产品插件，不在本仓库范围。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同建议
          required: true
        - label: 这个建议属于外壳层，不是某个产品插件的页面功能
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述场景，不要直接跳到方案。知道问题往往能推出更好的解法。
      placeholder: 我有二十多个产品，默认分组太长，找东西要滚很久。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解法
      placeholder: 分组支持嵌套，或者支持搜索产品名。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么它们不够好？这一段往往比方案本身更有价值。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我的使用习惯
        - 大多数多产品用户都会遇到
        - 不清楚
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考的其他产品做法等。
    validations:
      required: false
